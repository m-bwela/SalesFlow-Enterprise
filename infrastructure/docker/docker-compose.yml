services:
  postgres:
    image: postgres:17
    container_name: salesflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: salesflow
      POSTGRES_PASSWORD: salesflow
      POSTGRES_DB: salesflow
    ports:
      - "5433:5432"
    volumes:
      - salesflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salesflow -d salesflow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  salesflow-postgres-data: